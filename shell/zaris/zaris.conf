# ZarisWM config file
# 
#
# =)

gaps_in=5
border_size=3
gaps_out=5
rounding=10
max_fps=60 # max fps for updates of config & animations
focus_when_hover=1 # 0 - do not switch the focus when hover (only for tiling)
main_mod=SUPER # For moving, resizing
intelligent_transients=1 # keeps transients always on top.
no_unmap_saving=1 # disables saving unmapped windows (seems to break sometimes)
scratchpad_mon=0 # self-explanatory

# Execs
# exec-once=/home/me/MyEpicShellScript # will exec the script only when the WM launches
# exec=/home/me/MyEpicShellScript # will exec the script every time the config is reloaded

# Audio: on a systemd system these are typically already socket-activated
# and these lines are harmless no-ops (second launch attempt just exits).
# On OpenRC/runit/etc. with nothing starting them automatically, exec-once
# (fires once, after ZarisWM connects) is the right lifecycle point.
exec-once=pipewire
exec-once=pipewire-pulse
exec-once=wireplumber

# Notification daemon: implements org.freedesktop.Notifications over the
# session DBus so notify-send (screenshot.sh's call, and anything else that
# uses it) actually shows something instead of being a silent no-op. See
# ../dunst/dunstrc, themed to match this shell's palette (Colors.qml).
exec-once=dunst

# Wallpaper: solid color matching the shell's own palette (Colors.qml's
# `bg`) by default, using xsetroot rather than assuming a specific tool
# and image path exist. Swap for `xwallpaper --zoom /path/to/image.jpg`
# (or any other tool) if you want an actual image.
exec-once=xsetroot -solid '#0c0b1a'

# Starts the bar/launcher/OSD/notifications-integration/etc. Deliberately
# its own line, not chained after monitor setup or wallpaper (it used to
# be, via a shell && chain -- meant one of those failing silently took the
# whole shell down with it). If you have more than one monitor, set that
# up in start-zaris.sh instead, which runs before ZarisWM connects.
# QT_QPA_PLATFORMTHEME=qt6ct themes native Qt Widgets menus (the tray
# context menus) to match the shell's own palette instead of default grey
# -- harmless if qt6ct isn't installed, just falls back to the default style.
#
# Waits for xrandr's connected-monitor count to read the same on two
# consecutive checks (0.3s apart, up to 6s) before launching qs - this is
# the actual fix for bars/the dock sometimes missing on secondary monitors
# after boot/login. Root cause: Quickshell enumerates screens once at its
# own startup, and if RandR hasn't finished settling multi-monitor
# reconfiguration yet at that exact instant (start-zaris.sh's own xrandr
# call returning doesn't guarantee the X server's internal state has fully
# propagated), Quickshell's Variants{model: Quickshell.screens} in Bar.qml
# permanently undercounts screens for that session - it doesn't
# self-correct later even once xrandr settles, only a full qs restart
# picks up the real count (confirmed repeatedly: restarting qs after the
# fact always fixes it). Falls through to launching qs anyway after the
# timeout if the count never stabilizes, rather than waiting forever.
exec-once=sh -c 'prev=-1; for i in $(seq 1 20); do cur=$(xrandr --query 2>/dev/null | grep -c " connected"); if [ "$cur" = "$prev" ] && [ "$cur" -gt 0 ]; then break; fi; prev="$cur"; sleep 0.3; done; QT_QPA_PLATFORMTHEME=qt6ct qs -d'

# Idle-based screen lock, via xss-lock rather than xautolock (this
# project's earlier choice) -- xautolock isn't packaged for Debian under
# any name, while xss-lock is official on Arch, Debian, and Fedora alike.
# xss-lock fires off the X screensaver extension's activation event, so
# the idle timeout itself lives in the X server's own screensaver timer
# (xset q) rather than a dedicated flag like xautolock's -time -- same
# timeout as the DPMS blanking, since both are now driven by the same
# underlying timer. It also listens for logind's Lock signal (elogind
# reimplements this for non-systemd systems, and is already a shell
# dependency for the power menu's loginctl calls), so `loginctl
# lock-session` or a suspend/lid event locks too, not just idle timeout.
# Locker is plain i3lock, chosen because it's the only screen locker
# packaged natively on all three of Arch, Debian, and Fedora -- no
# blur/theming built in (solid color background only), a deliberate
# tradeoff for that portability rather than an oversight. If you want the
# old blurred-wallpaper look back, swap the command after `--` for a small
# wrapper script (screenshot via scrot/import, blur via imagemagick, then
# exec i3lock) -- see DEPENDENCIES.md for why that's a vendored-script job
# rather than a distro package on any of the three.
exec-once=xss-lock -- i3lock
# Layout
layout=0 # 0 - dwindle (default), 1 - master
layout {
    no_gaps_when_only=0 # disables gaps and borders when only window on screen
}

# colors
col.active_border=0x773bb2d4 # matches the Artix logo's own color (#3bb2d4) in the bar
col.inactive_border=0x77222222

# status command
# deprecated
# status_command=date +%a,\ %b\ %Y\ \ %I:%M\ %p
#

# animations
Animations {
    enabled=1 # For windows
    window_resize_speed=20 # This is for windows resizing
    workspaces=1 # For workspace animations (fixed, enabling by default)
    speed=20 # This is for workspaces
    cheap=1 # highly recommended
    borders=0
}

# example window rules, more in the wiki

# windowrule=float,class:krunner
# windowrule=float,role:pop-up
# windowrule=float,role:task_dialog
# windowrule=monitor 0,class:krunner
# windowrule=size 500 50,class:krunner
# windowrule=move 700 500,class:krunner
# windowrule=pseudo,class:discord

# Games launched through Steam (including Proton/Wine ones): Steam sets their
# WM_CLASS to steam_app_<appid> regardless of the actual game - confirmed live
# via xprop on No Man's Sky (steam_app_275850) - so this one rule covers any
# game launched through Steam rather than needing one per game.
windowrule=fullscreen,class:^steam_app_.*$

# Quickshell launcher: force floating. Confirmed via xprop that its window
# (Quickshell's FloatingWindow component) never sets ICCCM WM_CLASS at all,
# so class-based matching can never work here -- it reliably sets its title
# (_NET_WM_NAME) to "Launcher" instead, so match on that. It's a plain
# _NET_WM_WINDOW_TYPE_NORMAL window, so it doesn't get auto-centered like a
# dialog/modal would -- center it explicitly instead.
windowrule=float,title:^Launcher$
windowrule=center,title:^Launcher$

# ControlCenter.qml (the bar's "Control Center" flyout) and Settings.qml
# are both PopupWindows anchored directly to the bar's own full-width
# background surface (ControlCenterState.barItem, set whenever a monitor's
# launcher icon is clicked - see ControlCenterState.qml/SettingsState.qml)
# rather than title-matched FloatingWindows, so neither needs a windowrule
# pair here at all - positioning is entirely anchor-based, and follows
# BarConfig.position (top/bottom) automatically since it's computed from
# the bar's own real on-screen position rather than a fixed WM-side corner
# offset that only ever assumed the bar lived at the top.

# Volume/brightness OSD popup (OSD.qml, title "OSD"). Just centered like the
# windows above - it's transient enough that per-monitor anchoring isn't
# worth the complexity the "More" flyout needed.
windowrule=float,title:^OSD$
windowrule=center,title:^OSD$

# The dock's floating-mode window (Dock.qml) - only relevant when Settings'
# Dock mode is "floating" rather than "reserved" (a PanelWindow like the
# bar, which doesn't need a windowrule at all). The WM can't read
# ~/.config/quickshell/dock.json to know which edge Settings' Dock position
# is currently set to, so Dock.qml encodes it directly in its own window
# title ("Dock-top"/"Dock-bottom"/"Dock-left"/"Dock-right") and each gets
# its own static rule here instead - changing the position in Settings just
# makes a different one of these four match live, no WM-side awareness of
# the JSON setting needed. See topcenter/bottomcenter/leftcenter/
# rightcenter's implementations in events.cpp.
windowrule=float,title:^Dock-.*$
# 54 = Bar.qml's own fixed 44px height + the same 10px gap the other
# three positions use - the bar always reserves the top edge (its own
# PanelWindow anchors there natively, no windowrule involved), so a
# floating dock also positioned top needs a static offset to clear it
# rather than sitting flush under the screen edge and overlapping.
windowrule=topcenter 54,title:^Dock-top$
windowrule=bottomcenter 10,title:^Dock-bottom$
windowrule=leftcenter 10,title:^Dock-left$
windowrule=rightcenter 10,title:^Dock-right$

# Pin/unpin confirmation dialog (PinDialog.qml, title "Pin to Dock"),
# opened by right-clicking a Launcher result or an existing dock icon.
# Anchored bottom-center, sitting just above the dock itself (56px tall in
# either of its modes, plus its own up-to-10px floating-mode margin) rather
# than flush to the screen edge like the dock's own bottomcenter rule.
windowrule=float,title:^Pin to Dock$
windowrule=bottomcenter 70,title:^Pin to Dock$

# Bluetooth flyout (BluetoothPanel.qml, title "Bluetooth"). Centered like
# the settings/overflow windows - no per-monitor anchoring needed.
windowrule=float,title:^Bluetooth$
windowrule=center,title:^Bluetooth$

# Clipboard history picker (ClipboardHistoryPanel.qml, title
# "Clipboard History"). Centered like the other pickers/panels above.
windowrule=float,title:^Clipboard History$
windowrule=center,title:^Clipboard History$

# Notification history panel (NotificationHistoryPanel.qml, title
# "Notifications"). Centered like the other pickers/panels above.
windowrule=float,title:^Notifications$
windowrule=center,title:^Notifications$

# Wallpaper picker (WallpaperPickerPanel.qml, title "Wallpaper Picker").
# Centered like the other pickers/panels above.
windowrule=float,title:^Wallpaper Picker$
windowrule=center,title:^Wallpaper Picker$

# Profile picture picker (AvatarPickerPanel.qml, title "Choose Profile
# Picture"). Centered like the other pickers/panels above.
windowrule=float,title:^Choose Profile Picture$
windowrule=center,title:^Choose Profile Picture$

# keybinds
bind=SUPER,SPACE,exec,qs ipc call launcher toggle
bind=SUPER,Q,killactive,
bind=SUPER,RETURN,exec,alacritty # swap for your own terminal of choice

bind=SUPER,C,killactive, # alternate to SUPER+Q above - kept both, harmless
bind=SUPERSHIFT,Q,exec,pkill zaris
bind=SUPER,L,exec,i3lock

# Volume OSD (see ../zaris/osd-volume.sh + OSD.qml/OSDState.qml). No
# brightness keybinds by default - that needs brightnessctl (laptops) or
# ddcutil (external monitors over DDC/CI), neither assumed installed, and
# which one (if either) applies depends entirely on your hardware.
bind=,XF86AudioRaiseVolume,exec,~/.config/zaris/osd-volume.sh up
bind=,XF86AudioLowerVolume,exec,~/.config/zaris/osd-volume.sh down
bind=,XF86AudioMute,exec,~/.config/zaris/osd-volume.sh mute

# Brightness OSD (see BrightnessService.qml/OSD.qml) - unlike volume, this
# goes straight through Quickshell's own IPC rather than a wrapper script,
# since picking ddcutil vs brightnessctl vs asdbctl per-monitor is real
# logic that lives in BrightnessService.qml itself, not a one-line command.
# Commented out by default: install `ddcutil` (external DDC/CI monitors)
# and/or `brightnessctl` (internal laptop panel) first - see
# DEPENDENCIES.md's "Optional dependencies" section - then uncomment
# whichever (or both) apply to your hardware.
# bind=,XF86MonBrightnessUp,exec,qs ipc call brightness increase
# bind=,XF86MonBrightnessDown,exec,qs ipc call brightness decrease

bind=SUPER,LEFT,movewindow,l
bind=SUPER,RIGHT,movewindow,r
bind=SUPER,UP,movewindow,u
bind=SUPER,DOWN,movewindow,d

bind=SUPER,LEFT,movefocus,l
bind=SUPER,RIGHT,movefocus,r
bind=SUPER,UP,movefocus,u
bind=SUPER,DOWN,movefocus,d

bind=SUPER,F,fullscreen,

bind=SUPER,1,workspace,1
bind=SUPER,2,workspace,2
bind=SUPER,3,workspace,3
bind=SUPER,4,workspace,4
bind=SUPER,5,workspace,5
bind=SUPER,6,workspace,6
bind=SUPER,7,workspace,7
bind=SUPER,8,workspace,8
bind=SUPER,9,workspace,9

bind=SUPERSHIFT,1,movetoworkspace,1
bind=SUPERSHIFT,2,movetoworkspace,2
bind=SUPERSHIFT,3,movetoworkspace,3
bind=SUPERSHIFT,4,movetoworkspace,4
bind=SUPERSHIFT,5,movetoworkspace,5
bind=SUPERSHIFT,6,movetoworkspace,6
bind=SUPERSHIFT,7,movetoworkspace,7
bind=SUPERSHIFT,8,movetoworkspace,8
bind=SUPERSHIFT,9,movetoworkspace,9

bind=SUPERSHIFT,S,movetoworkspace,scratchpad
bind=SUPER,S,scratchpad,

bind=SUPERSHIFT,SPACE,togglefloating,

bind=SUPER,equal,splitratio,+
bind=SUPER,minus,splitratio,-
