# ZarisWM config file
# 
#
# =)

gaps_in=5
border_size=3
gaps_out=5
rounding=10
max_fps=60 # max fps for updates of config & animations
focus_when_hover=1 # 0 - do not switch the focus when hover (only for tiling)
main_mod=SUPER # For moving, resizing
intelligent_transients=1 # keeps transients always on top.
no_unmap_saving=1 # disables saving unmapped windows (seems to break sometimes)
scratchpad_mon=0 # self-explanatory

# Execs
# exec-once=/home/me/MyEpicShellScript # will exec the script only when the WM launches
# exec=/home/me/MyEpicShellScript # will exec the script every time the config is reloaded

# Audio: on a systemd system these are typically already socket-activated
# and these lines are harmless no-ops (second launch attempt just exits).
# On OpenRC/runit/etc. with nothing starting them automatically, exec-once
# (fires once, after ZarisWM connects) is the right lifecycle point.
exec-once=pipewire
exec-once=pipewire-pulse
exec-once=wireplumber

# Notification daemon: implements org.freedesktop.Notifications over the
# session DBus so notify-send (screenshot.sh's call, and anything else that
# uses it) actually shows something instead of being a silent no-op. See
# ../dunst/dunstrc, themed to match this shell's palette (Colors.qml).
exec-once=dunst

# Wallpaper: solid color matching the shell's own palette (Colors.qml's
# `bg`) by default, using xsetroot rather than assuming a specific tool
# and image path exist. Swap for `xwallpaper --zoom /path/to/image.jpg`
# (or any other tool) if you want an actual image.
exec-once=xsetroot -solid '#0c0b1a'

# Starts the bar/launcher/OSD/notifications-integration/etc. Deliberately
# its own line, not chained after monitor setup or wallpaper (it used to
# be, via a shell && chain -- meant one of those failing silently took the
# whole shell down with it). If you have more than one monitor, set that
# up in start-zaris.sh instead, which runs before ZarisWM connects.
# QT_QPA_PLATFORMTHEME=qt6ct themes native Qt Widgets menus (the tray
# context menus) to match the shell's own palette instead of default grey
# -- harmless if qt6ct isn't installed, just falls back to the default style.
exec-once=QT_QPA_PLATFORMTHEME=qt6ct qs -d

# Idle-based screen lock. xautolock is used here rather than xss-lock
# (which leans on logind's Lock/Unlock DBus signals) since it works the
# same regardless of init system; betterlockscreen wraps i3lock-color
# using the wallpaper cached earlier via
# `betterlockscreen -u <path> --fx blur` (re-run that manually after changing
# the wallpaper - it's a one-time render, not automatic). `-l` takes exactly
# ONE effect name matching a cached variant, not a comma list - `-l dim,blur`
# silently falls back to the plain, unblurred image since "dim,blur" isn't a
# real cached name; confirmed by checking ~/.cache/betterlockscreen/current/,
# which only ever has one file per single effect (lock_dim.png, lock_blur.png,
# ...), never a combined one.
# -time 10: lock after 10 minutes idle, matching the default DPMS timeout
# (xset q) so the lock and the screen blanking land together.
exec-once=xautolock -time 10 -locker "betterlockscreen -l blur"
# Layout
layout=0 # 0 - dwindle (default), 1 - master
layout {
    no_gaps_when_only=0 # disables gaps and borders when only window on screen
}

# colors
col.active_border=0x773bb2d4 # matches the Artix logo's own color (#3bb2d4) in the bar
col.inactive_border=0x77222222

# status command
# deprecated
# status_command=date +%a,\ %b\ %Y\ \ %I:%M\ %p
#

# animations
Animations {
    enabled=1 # For windows
    window_resize_speed=20 # This is for windows resizing
    workspaces=1 # For workspace animations (fixed, enabling by default)
    speed=20 # This is for workspaces
    cheap=1 # highly recommended
    borders=0
}

# example window rules, more in the wiki

# windowrule=float,class:krunner
# windowrule=float,role:pop-up
# windowrule=float,role:task_dialog
# windowrule=monitor 0,class:krunner
# windowrule=size 500 50,class:krunner
# windowrule=move 700 500,class:krunner
# windowrule=pseudo,class:discord

# Games launched through Steam (including Proton/Wine ones): Steam sets their
# WM_CLASS to steam_app_<appid> regardless of the actual game - confirmed live
# via xprop on No Man's Sky (steam_app_275850) - so this one rule covers any
# game launched through Steam rather than needing one per game.
windowrule=fullscreen,class:^steam_app_.*$

# Quickshell launcher: force floating. Confirmed via xprop that its window
# (Quickshell's FloatingWindow component) never sets ICCCM WM_CLASS at all,
# so class-based matching can never work here -- it reliably sets its title
# (_NET_WM_NAME) to "Launcher" instead, so match on that. It's a plain
# _NET_WM_WINDOW_TYPE_NORMAL window, so it doesn't get auto-centered like a
# dialog/modal would -- center it explicitly instead.
windowrule=float,title:^Launcher$
windowrule=center,title:^Launcher$

# Same deal for the bar's "hidden tray" overflow flyout (Overflow.qml, title
# set to "More") -- except this one anchors under the chevron that opens it
# (kept as the last/rightmost bar icon in Bar.qml specifically so this lines
# up) instead of being centered. Quickshell has no way to set a window's own
# position (FloatingWindow exposes width/height but not x/y), so this has to
# be computed WM-side: 14 is the bar content's right inset (4px outer margin
# + 10px Bar.qml row margin), 48 is just below the 44px reserved bar height.
windowrule=float,title:^More$
windowrule=topright 14 48,title:^More$

# Same deal for the bar module settings window (Settings.qml, title "Bar Settings").
windowrule=float,title:^Bar Settings$
windowrule=center,title:^Bar Settings$

# Volume/brightness OSD popup (OSD.qml, title "OSD"). Just centered like the
# windows above - it's transient enough that per-monitor anchoring isn't
# worth the complexity the "More" flyout needed.
windowrule=float,title:^OSD$
windowrule=center,title:^OSD$

# keybinds
bind=SUPER,SPACE,exec,qs ipc call launcher toggle
bind=SUPER,Q,killactive,
bind=SUPER,RETURN,exec,alacritty # swap for your own terminal of choice

bind=SUPER,C,killactive, # alternate to SUPER+Q above - kept both, harmless
bind=SUPERSHIFT,Q,exec,pkill zaris
bind=SUPER,L,exec,betterlockscreen -l blur

# Volume OSD (see ../zaris/osd-volume.sh + OSD.qml/OSDState.qml). No
# brightness keybinds by default - that needs brightnessctl (laptops) or
# ddcutil (external monitors over DDC/CI), neither assumed installed, and
# which one (if either) applies depends entirely on your hardware.
bind=,XF86AudioRaiseVolume,exec,~/.config/zaris/osd-volume.sh up
bind=,XF86AudioLowerVolume,exec,~/.config/zaris/osd-volume.sh down
bind=,XF86AudioMute,exec,~/.config/zaris/osd-volume.sh mute

bind=SUPER,LEFT,movewindow,l
bind=SUPER,RIGHT,movewindow,r
bind=SUPER,UP,movewindow,u
bind=SUPER,DOWN,movewindow,d

bind=SUPER,LEFT,movefocus,l
bind=SUPER,RIGHT,movefocus,r
bind=SUPER,UP,movefocus,u
bind=SUPER,DOWN,movefocus,d

bind=SUPER,F,fullscreen,

bind=SUPER,1,workspace,1
bind=SUPER,2,workspace,2
bind=SUPER,3,workspace,3
bind=SUPER,4,workspace,4
bind=SUPER,5,workspace,5
bind=SUPER,6,workspace,6
bind=SUPER,7,workspace,7
bind=SUPER,8,workspace,8
bind=SUPER,9,workspace,9

bind=SUPERSHIFT,1,movetoworkspace,1
bind=SUPERSHIFT,2,movetoworkspace,2
bind=SUPERSHIFT,3,movetoworkspace,3
bind=SUPERSHIFT,4,movetoworkspace,4
bind=SUPERSHIFT,5,movetoworkspace,5
bind=SUPERSHIFT,6,movetoworkspace,6
bind=SUPERSHIFT,7,movetoworkspace,7
bind=SUPERSHIFT,8,movetoworkspace,8
bind=SUPERSHIFT,9,movetoworkspace,9

bind=SUPERSHIFT,S,movetoworkspace,scratchpad
bind=SUPER,S,scratchpad,

bind=SUPERSHIFT,SPACE,togglefloating,

bind=SUPER,equal,splitratio,+
bind=SUPER,minus,splitratio,-
